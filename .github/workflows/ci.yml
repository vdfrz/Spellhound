name: Spellhound CI and delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Spellhound checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/matters/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: python -m pip install -r server/matters/requirements.txt
      - run: npm run test:matters
      - name: Build production image
        run: docker build --tag "spellhound:$GITHUB_SHA" .
      - name: Check the install page and Word manifest in the image
        run: |
          docker run --detach --name pilot --publish 127.0.0.1:18080:8080 \
            --env SPELLHOUND_ORIGIN=https://pilot.invalid "spellhound:$GITHUB_SHA"
          trap 'docker logs pilot; docker rm -f pilot' EXIT
          base=http://127.0.0.1:18080
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 "$base/health" -o "$RUNNER_TEMP/health"
          grep -Fx ok "$RUNNER_TEMP/health"
          curl -fsS "$base/" | grep -Fq '/manifest.xml'
          curl -fsS "$base/manifest.xml" > "$RUNNER_TEMP/manifest.xml"
          python - "$RUNNER_TEMP/manifest.xml" <<'PY'
          import sys
          from xml.etree import ElementTree

          root = ElementTree.parse(sys.argv[1]).getroot()
          urls = [e.get('DefaultValue', '') for e in root.iter()]
          assert 'https://pilot.invalid/index.html' in urls, 'Missing hosted task pane'
          assert all('spellhound.example' not in url for url in urls)
          PY
      - name: Save tested image for delivery
        if: github.event_name == 'push'
        run: docker save "spellhound:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/spellhound.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: verified-image
          path: ${{ runner.temp }}/spellhound.tar.gz
          retention-days: 1
          if-no-files-found: error

  deliver:
    name: Publish verified image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-image
      - run: docker load --input spellhound.tar.gz
      - name: Publish this commit to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          docker tag "spellhound:$GITHUB_SHA" "$image"
          docker push "$image"
